services:
  amos:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AMOS_BIND_ADDRESS: 0.0.0.0
      AMOS_DEMO_LOOPBACK_PUBLISH: "true"
      RUST_LOG: amos=info
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - amos-demo-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  amos-demo-data:
